name = "dn-receipt-portal"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Two workers are deployed from this code, sharing one database and one file bucket:
#   dn-receipt-portal  (this top section)  - staff page, open to staff
#   dn-receipt-hr      ([env.hr] below)     - HR page, whole worker behind Cloudflare Access
# Deploy commands:  npx wrangler deploy            (staff)
#                   npx wrangler deploy --env hr   (HR)

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "dn-receipts"
database_id = "1716fa36-965a-4262-a09f-3f423c4d60fa"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "dn-receipts"

# Cloudflare Workers AI reads the receipt photos (free daily allowance)
[ai]
binding = "AI"

[vars]
ROLE = "staff"
HR_URL = "https://dn-receipt-hr.hairul-izwan.workers.dev/hr.html"

# ---------------- HR worker ----------------
[env.hr]
name = "dn-receipt-hr"

[env.hr.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[env.hr.d1_databases]]
binding = "DB"
database_name = "dn-receipts"
database_id = "1716fa36-965a-4262-a09f-3f423c4d60fa"

[[env.hr.r2_buckets]]
binding = "RECEIPTS"
bucket_name = "dn-receipts"

[env.hr.ai]
binding = "AI"

[env.hr.vars]
ROLE = "hr"
STAFF_URL = "https://dn-receipt-portal.hairul-izwan.workers.dev/"
# HR users who can see all receipts and run the matching (comma separated). Must also be allowed in the Access policy.
HR_EMAILS = "hairul.izwan@telecontinent.com.my,farah.fauziah@telecontinent.com.my,farahana.khairudin@telecontinent.com.my,sharon.sunita@telecontinent.com.my,waionn@telecontinent.com.my,anisah.zaki@telecontinent.com.my"
# Zero Trust > Access settings (team domain) and Access > Applications > (HR app) > Overview (AUD tag)
ACCESS_TEAM_DOMAIN = "dawn-flower-2e1b.cloudflareaccess.com"
ACCESS_AUD = "3a0565ae87b2d0b14a0a5631775b155205545fe0134f93991c9928bb63b33594"
