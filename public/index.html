<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DN Receipt Submission</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top"><div class="wrap">
  <div><h1>DN Receipt Submission</h1><div class="sub">Telecontinent Sdn Bhd · Human Resources &amp; Administration</div></div>
</div></header>

<main class="wrap">
  <!-- Step 1: staff ID -->
  <section id="s1" class="card" style="max-width:520px;margin:16px auto">
    <h2>Your staff ID</h2>
    <form id="idf" novalidate>
      <label for="tc">Staff ID</label>
      <input id="tc" placeholder="e.g. TC4736" autocomplete="off" autocapitalize="characters" inputmode="text">
      <div id="idmsg" class="msg hidden"></div>
      <button type="submit" style="margin-top:12px;width:100%">Next</button>
    </form>
  </section>

  <!-- Step 2: receipt -->
  <section id="s2" class="card hidden" style="max-width:720px;margin:16px auto">
    <div class="msg info" id="who"></div>
    <h2>Submit a receipt</h2>
    <p class="muted" style="margin-top:-6px">One receipt per submission. Use the claim month and category of your claim in the DN system.</p>
    <form id="f" novalidate>
      <input type="hidden" name="tc_id" id="tc_id">
      <div class="grid">
        <div><label class="req" for="claim_month">Claim month</label><select id="claim_month" name="claim_month"></select></div>
        <div><label class="req" for="category">Claim category</label><select id="category" name="category"><option value="">Choose…</option></select></div>
        <div><label class="req" for="expense_date">Date on receipt</label><input type="date" id="expense_date" name="expense_date"></div>
        <div><label class="req" for="amount">Receipt amount (RM)</label><input id="amount" name="amount" inputmode="decimal" placeholder="e.g. 45.60" autocomplete="off"></div>
        <div><label for="merchant">Shop / clinic / provider</label><input id="merchant" name="merchant" maxlength="120"></div>
        <div><label for="receipt_no">Receipt or invoice no.</label><input id="receipt_no" name="receipt_no" maxlength="60"></div>
      </div>
      <div style="margin-top:12px"><label for="remark">Remark</label><textarea id="remark" name="remark" maxlength="300" placeholder="Optional, e.g. client site visit Shah Alam"></textarea></div>
      <div style="margin-top:12px"><label class="req" for="file">Receipt photo or PDF</label><input type="file" id="file" name="file" accept="image/*,application/pdf"></div>
      <div id="fmsg" class="msg hidden"></div>
      <div class="row" style="margin-top:12px">
        <button id="sub" type="submit">Submit receipt</button>
        <button id="notme" type="button" class="ghost">Not me / change ID</button>
      </div>
    </form>
  </section>

  <!-- Receipts sent in this visit -->
  <section id="s3" class="card hidden" style="max-width:720px;margin:16px auto">
    <h2>Sent in this visit</h2>
    <p class="muted" style="margin-top:-6px">Keep the reference number. HR checks every receipt before payment.</p>
    <div id="sent" class="list"></div>
  </section>
</main>

<script src="/common.js"></script>
<script>
let CATS = [], WHO = null; const SENT = [];

async function init() {
  try { CATS = (await api('/api/me')).categories || []; } catch { /* page still works; server re-checks */ }
  for (const m of recentMonths(12)) $('#claim_month').add(new Option(monthLabel(m), m));
  for (const c of CATS) $('#category').add(new Option(c, c));
  $('#expense_date').max = todayMY();
  try { const last = localStorage.getItem('dnrp_tc'); if (last) $('#tc').value = last; } catch {}
}

$('#idf').onsubmit = async (ev) => {
  ev.preventDefault();
  const msg = $('#idmsg'); msg.classList.add('hidden');
  try {
    WHO = await api('/api/lookup', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ tc_id: $('#tc').value }) });
    try { localStorage.setItem('dnrp_tc', WHO.tc_id); } catch {}
    $('#tc_id').value = WHO.tc_id;
    $('#who').textContent = `Submitting as ${WHO.name} (${WHO.tc_id}). If this is not you, tap "Not me".`;
    $('#s1').classList.add('hidden'); $('#s2').classList.remove('hidden');
  } catch (e) { showMsg(msg, 'err', e.message); }
};

$('#notme').onclick = () => {
  WHO = null; $('#tc').value = ''; try { localStorage.removeItem('dnrp_tc'); } catch {}
  $('#s2').classList.add('hidden'); $('#s1').classList.remove('hidden'); $('#tc').focus();
};

$('#f').onsubmit = async (ev) => {
  ev.preventDefault();
  const msg = $('#fmsg'); msg.classList.add('hidden');
  const fd = new FormData($('#f'));
  const miss = [];
  if (!fd.get('category')) miss.push('claim category');
  if (!fd.get('expense_date')) miss.push('date on receipt');
  if (!String(fd.get('amount')).trim()) miss.push('receipt amount');
  const file = $('#file').files[0];
  if (!file) miss.push('receipt photo or PDF');
  if (miss.length) { showMsg(msg, 'err', 'Please fill in: ' + miss.join(', ') + '.'); return; }
  fd.set('file', await shrinkImage(file));
  $('#sub').disabled = true; $('#sub').textContent = 'Uploading…';
  try {
    const r = await api('/api/receipts', { method: 'POST', body: fd });
    const amt = Number(String(fd.get('amount')).replace(/,/g, '')).toFixed(2);
    showMsg(msg, 'ok', `Receipt received. Reference ${r.ref}. You can submit the next one.`);
    SENT.unshift({ ref: r.ref, cat: fd.get('category'), amt, date: fd.get('expense_date'), month: fd.get('claim_month') });
    renderSent();
    ['expense_date', 'amount', 'merchant', 'receipt_no', 'remark', 'file'].forEach(k => $('#' + k).value = '');
  } catch (e) { showMsg(msg, 'err', e.message); }
  finally { $('#sub').disabled = false; $('#sub').textContent = 'Submit receipt'; }
};

function renderSent() {
  $('#s3').classList.remove('hidden');
  $('#sent').innerHTML = SENT.map(s => `<div class="item"><div><strong>${esc(s.cat)}</strong> · RM ${esc(s.amt)}
    <div class="muted">Claim month ${monthLabel(s.month)} · Receipt date ${fmtDate(s.date)}</div></div>
    <div><span class="chip Accepted">${esc(s.ref)}</span></div></div>`).join('');
}

init();
</script>
</body>
</html>
