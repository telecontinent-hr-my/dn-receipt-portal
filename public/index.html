<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DN Claim Receipts</title>
<link rel="stylesheet" href="/app.css?v=20261104c">
<style>
  .big{font-size:18px}
  .claim{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:#fff}
  .claim .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .claim .amt{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .claim .say{margin-top:8px;font-size:14px}
  .claim ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
  .files{margin-top:8px;font-size:13.5px}
  .files div{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding:5px 0}
  .files button{padding:0 8px;font-size:12px}
  .month{margin-top:18px;font-weight:700;color:var(--muted)}
  .busy{color:var(--brand);font-weight:600;margin-top:8px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div><h1>DN Claim Receipts</h1><div class="sub">Telecontinent Sdn Bhd · Human Resources &amp; Administration</div></div>
</div></header>

<main class="wrap">
  <section id="s1" class="card" style="max-width:520px;margin:16px auto">
    <h2>Your staff ID</h2>
    <form id="idf" novalidate>
      <input id="tc" class="big" placeholder="e.g. TC4736" autocomplete="off" autocapitalize="characters">
      <div id="idmsg" class="msg hidden"></div>
      <button type="submit" style="margin-top:12px;width:100%">Show my DN claims</button>
    </form>
  </section>

  <section id="s2" class="hidden" style="max-width:680px;margin:16px auto">
    <div class="card">
      <div class="row"><div><strong id="who"></strong><div class="muted" style="font-size:13px">These are your claims approved by DN. Upload the receipts for each claim. The system reads and checks them.</div></div>
        <button id="notme" class="small ghost right" type="button">Not me</button></div>
    </div>
    <div id="list"></div>
  </section>
</main>

<script src="/demo-mock.js?v=20261104c"></script>
<script src="/common.js?v=20261104c"></script>
<script>
let WHO = null;

const SAY = {
  'Not submitted': c => 'Upload the receipts for this claim.',
  'Cleared': c => c.read > c.approved ? `✓ Checked. Receipts RM ${rm(c.read)} cover the approved RM ${rm(c.approved)}. Nothing more to do.` : '✓ Checked. Receipts match the DN approval. Nothing more to do.',
  'Short': c => `We read RM ${rm(c.read)} from your receipts. DN approved RM ${rm(c.approved)}. Please add receipts for the missing RM ${rm(c.approved - c.read)}, or remove a wrong photo and upload a clearer one.`,
  'HR check': c => 'HR will check this claim because:',
  'Cleared by HR': c => '✓ Checked by HR. Nothing more to do.',
  'Rejected by HR': c => 'Not accepted by HR.'
};

async function load(tc) {
  const r = await api('/api/my-claims', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ tc_id: tc }) });
  WHO = r; draw();
}

$('#idf').onsubmit = async (ev) => {
  ev.preventDefault(); const msg = $('#idmsg'); msg.classList.add('hidden');
  try {
    await load($('#tc').value);
    try { localStorage.setItem('dnrp_tc', WHO.tc_id); } catch {}
    $('#s1').classList.add('hidden'); $('#s2').classList.remove('hidden');
  } catch (e) { showMsg(msg, 'err', e.message); }
};
$('#notme').onclick = () => { WHO = null; try { localStorage.removeItem('dnrp_tc'); } catch {}; $('#tc').value = ''; $('#s2').classList.add('hidden'); $('#s1').classList.remove('hidden'); };

function draw() {
  $('#who').textContent = `${WHO.name} (${WHO.tc_id})`;
  if (!WHO.claims.length) { $('#list').innerHTML = '<div class="card muted">No DN-approved claims found for you yet. HR uploads the DN approvals each month. Please check again later.</div>'; return; }
  let html = '', last = '';
  for (const c of WHO.claims) {
    if (c.month !== last) { html += `<div class="month">Claim month ${monthLabel(c.month)}</div>`; last = c.month; }
    const locked = c.status === 'Cleared by HR' || c.status === 'Rejected by HR';
    html += `<div class="claim" id="c-${c.id}">
      <div class="top"><div><strong>${esc(c.category)}</strong><div class="muted" style="font-size:13px">Approved by DN</div></div>
        <div style="text-align:right"><div class="amt">RM ${rm(c.approved)}</div><span class="chip ${STATUS_CHIP[c.status] || ''}">${esc(c.status === 'Short' ? 'Receipts short' : c.status)}</span></div></div>
      <div class="say">${esc((SAY[c.status] || (() => ''))(c))}</div>
      ${c.status === 'HR check' && c.flags.length ? '<ul>' + c.flags.map(f => `<li>${esc(f)}</li>`).join('') + '</ul>' : ''}
      ${c.hr_note ? `<div class="say"><strong>HR note:</strong> ${esc(c.hr_note)}</div>` : ''}
      ${c.files.length ? '<div class="files">' + c.files.map(f => `<div><span>📎 ${esc(f.name)}</span><span>${f.read === null ? '<span class="muted">not read</span>' : 'RM ' + rm(f.read)}
          ${!locked && c.status !== 'Cleared' ? ` <button class="ghost danger" data-rm="${f.id}" data-c="${c.id}" type="button">Remove</button>` : ''}</span></div>`).join('') + '</div>' : ''}
      ${!locked && c.status !== 'Cleared' ? `<label class="btn" style="margin-top:10px;display:inline-block">+ Add receipts<input type="file" accept="image/*,application/pdf" multiple data-up="${c.id}" style="display:none"></label>` : ''}
      <div class="busy hidden" id="b-${c.id}"></div>
      <div class="msg err hidden" id="e-${c.id}"></div>
    </div>`;
  }
  $('#list').innerHTML = html;
  $$('[data-up]').forEach(inp => inp.onchange = () => send(inp.dataset.up, [...inp.files]));
  $$('[data-rm]').forEach(b => b.onclick = async () => {
    if (!confirm('Remove this photo?')) return;
    try { const r = await api(`/api/claims/${b.dataset.c}/photo/${b.dataset.rm}/remove`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ tc_id: WHO.tc_id }) });
      replace(r.claim); } catch (e) { alert(e.message); }
  });
}
function replace(nc) { const i = WHO.claims.findIndex(c => c.id === nc.id); if (i >= 0) WHO.claims[i] = { ...WHO.claims[i], ...nc }; draw(); }

async function send(claimId, files) {
  const busy = $('#b-' + claimId), err = $('#e-' + claimId);
  busy.classList.remove('hidden'); err.classList.add('hidden');
  const errors = [];
  for (let i = 0; i < files.length; i++) {
    busy.textContent = `Reading receipt ${i + 1} of ${files.length}… please wait`;
    try { const r = await uploadReceipt(claimId, WHO.tc_id, files[i]); WHO.claims[WHO.claims.findIndex(c => c.id === claimId)] = { ...r.claim }; }
    catch (e) { errors.push(`${files[i].name}: ${e.message}`); }
  }
  draw();
  if (errors.length) { const e2 = $('#e-' + claimId); e2.innerHTML = errors.map(esc).join('<br>'); e2.classList.remove('hidden'); }
}

try { const last = localStorage.getItem('dnrp_tc'); if (last) $('#tc').value = last; } catch {}
</script>
</body>
</html>
